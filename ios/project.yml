name: Rolo
options:
  bundleIdPrefix: dev.rolo.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Rolo:
    type: application
    platform: iOS
    sources:
      - path: Rolo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ROLO_BUNDLE_PREFIX).rolo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Rolo/Info.plist
      properties:
        CFBundleDisplayName: Rolo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Rolo uses your location to show departures near you and plan trips from where you are.
        NSLocalNetworkUsageDescription: Rolo talks to your own trip-planning server on your home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
